[package]
name = "kense-kui"
description = "KUI components for GPUI on native desktop and WASM web"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kense-labs/KUI"
homepage = "https://kense-labs.github.io/kui/"
documentation = "https://docs.rs/kense-kui"
readme = "README.md"
keywords = ["gpui", "ui", "components", "desktop", "wasm"]
categories = ["gui", "wasm"]
publish = false

[lib]
name = "kui"

[features]
default = ["test-support"]
test-support = ["gpui/test-support"]
native = ["dep:gpui_platform"]
web = []

[dependencies]
# KANTOR PATCH: align with Kantor's gpui-pre 0.3.11 (upstream KUI pins =0.3.10)
gpui = { package = "gpui-pre", version = "0.3.11", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.11", default-features = false, optional = true }

web-time = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false }
unicode-segmentation = "1"
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.11", default-features = false, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
