[package]
name = "kwrok_dictation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Local CPU Whisper dictation for Kwrok"

[dependencies]
anyhow = "1"
ahash = "0.8"
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
clap = { version = "4", features = ["derive"] }
fast2s.workspace = true
hound = "3.5"
rustfft = "6"
serde_json = "1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[[bin]]
name = "kwrok-dictation"
path = "src/main.rs"
