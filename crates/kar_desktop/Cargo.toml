[package]
name = "kar_desktop"
description = "Pure-Rust GPUI desktop workbench for Kar + Kantor Office with KUI"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/kense-labs/kwork"
default-run = "kar-desktop"

[[bin]]
name = "kar-desktop"
path = "src/main.rs"

[[test]]
name = "browser_live"
path = "tests/browser_live.rs"
harness = false

[[test]]
name = "browser_adversarial"
path = "tests/browser_adversarial.rs"
harness = false

[[test]]
name = "office_wps_live"
path = "tests/office_wps_live.rs"
harness = false

[dependencies]
anyhow.workspace = true
async-channel = "2"
axum.workspace = true
base64.workspace = true
cpal = "0.16"
chrono = { workspace = true, features = ["clock"] }
docs_engine.workspace = true
docs_pdf.workspace = true
docs_ui.workspace = true
env_logger.workspace = true
fast2s.workspace = true
flate2 = "1"
futures.workspace = true
form_urlencoded = "1"
gix-quote = "0.6"
gpui-kit.workspace = true
image = { workspace = true, features = ["png"] }
kar.workspace = true
kar-documents.workspace = true
kantor_core.workspace = true
kantor_theme.workspace = true
kantor_ui.workspace = true
kui.workspace = true
kwrok_webview.workspace = true
log.workspace = true
markdown = "1.0"
notify = "8"
pdf_engine.workspace = true
pdf_ui.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1"
sheets_engine.workspace = true
sheets_pdf.workspace = true
sheets_ui.workspace = true
slides_engine.workspace = true
slides_pdf.workspace = true
slides_ui.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
tokio.workspace = true
zip.workspace = true
tower = { version = "0.5", features = ["util"] }
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-segmentation = "1"
ureq.workspace = true
url = "2"
uuid = { workspace = true, features = ["v5"] }
vt100 = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { version = "0.3.11", features = ["test-support"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[lints]
workspace = true
