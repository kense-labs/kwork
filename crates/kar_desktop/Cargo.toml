[package]
name = "kar_desktop"
description = "Pure-Rust GPUI desktop workbench for Kar + Kantor Office with KUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "kar-desktop"

[[bin]]
name = "kar-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel = "2"
axum.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
docs_engine.workspace = true
docs_ui.workspace = true
env_logger.workspace = true
futures.workspace = true
gix-quote = "0.6"
gpui-kit.workspace = true
image = { workspace = true, features = ["png"] }
kar.workspace = true
kar-documents.workspace = true
kantor_core.workspace = true
kantor_theme.workspace = true
kantor_ui.workspace = true
kui.workspace = true
log.workspace = true
markdown = "1.0"
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1"
sheets_engine.workspace = true
sheets_ui.workspace = true
slides_engine.workspace = true
slides_ui.workspace = true
tokio.workspace = true
ureq.workspace = true
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { version = "0.3.11", features = ["test-support"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
