name: Native desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workbench:
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build the native workbench
        run: cargo build --locked -p kar_desktop
      - name: Test the Rust dictation engine
        run: cargo test --locked -p kwrok_dictation
      - name: Run tests independent of a signed-in coding agent
        run: >
          cargo test --locked -p kar_desktop --
          --skip real_codex_send_second_client_mid_tool_disconnect_reconnect_and_history_parity
          --skip workbench_guest_link_stays_bound_to_its_chat_and_revokes
      - name: Package the app
        run: scripts/macos-kwrok-app.sh target/debug/kar-desktop target
      - name: Verify packaged dictation and runtime helpers
        run: |
          target/Kwork.app/Contents/Helpers/kwrok-dictation --list-devices | grep 'type=cpu'
          test -x target/Kwork.app/Contents/Helpers/aster-acp
          test -s target/Kwork.app/Contents/Resources/Dictation/whisper-base-Q8_0.gguf
          codesign --verify --deep --strict target/Kwork.app
