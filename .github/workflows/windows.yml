name: Windows build

on:
  workflow_dispatch:
  push:
    # workflow_dispatch requires the workflow on the default branch; push
    # events read the workflow from the pushed ref, so build branches work too.
    branches: [main, 'workbuddy/**']
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'services/**'
      - 'scripts/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '.github/workflows/windows.yml'

jobs:
  build:
    # The manual desktop test needs a runner with a working WebView2 DevTools endpoint.
    # https://github.com/actions/runner-images/issues/14738
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'windows-2022' || 'windows-latest' }}
    env:
      KWORK_UI_BUILD: always
      # First Windows pipeline: skip the optional wasm-opt size pass (it needs
      # a .cmd shim); the installer ships the unoptimized 27MB wasm instead.
      KWORK_WASM_OPT: off
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Node.js (bundled Harness runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: bun install --no-save

      - name: Package the pinned Electron account renderer
        run: |
          bun install --cwd services/account-platform-electron --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node services/account-platform-electron/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/build-account-platform-electron.mjs --windows-bundle

      - name: Build GPUI/WASM frontend
        run: bun run ui:build

      - name: Verify native host compiles
        run: cargo check -p dsh-gpui

      - name: Build Windows installer (NSIS)
        run: bun x tauri build --bundles nsis

      - name: Stage the portable Windows runtime
        run: |
          if (!(Test-Path target/release/account-platform/electron.exe)) {
            Copy-Item services/account-platform-electron/bundle target/release/account-platform -Recurse -Force
          }

      - name: Exercise account pages inside KWork
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: bun scripts/account-platform-windows-smoke.mjs target/release/KWork.exe

      - name: Verify the Electron renderer in isolation
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        run: node scripts/account-platform-electron-smoke.mjs

      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-x64
          if-no-files-found: error
          path: |
            target/release/KWork.exe
            target/release/account-platform/
            target/release/bundle/nsis/*.exe
