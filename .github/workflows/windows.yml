name: Windows build

on:
  workflow_dispatch:
  push:
    # workflow_dispatch requires the workflow on the default branch; push
    # events read the workflow from the pushed ref, so build branches work too.
    branches: [main, 'workbuddy/**']
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'services/**'
      - 'scripts/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '.github/workflows/windows.yml'

jobs:
  build:
    # The manual desktop test needs a runner with a working WebView2 DevTools endpoint.
    # https://github.com/actions/runner-images/issues/14738
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'windows-2022' || 'windows-latest' }}
    env:
      KWORK_UI_BUILD: always
      # First Windows pipeline: skip the optional wasm-opt size pass (it needs
      # a .cmd shim); the installer ships the unoptimized 27MB wasm instead.
      KWORK_WASM_OPT: off
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Node.js (bundled Harness runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: bun install --no-save

      - name: Package the pinned Electron account renderer
        run: |
          bun install --cwd services/account-platform-electron --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node services/account-platform-electron/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/build-account-platform-electron.mjs --windows-bundle

      - name: Verify the Electron renderer in isolation
        id: electron-smoke
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/account-platform-electron-smoke.mjs 2>&1 | Tee-Object -FilePath windows-electron-smoke.log
          exit $LASTEXITCODE

      - name: Upload the renderer smoke result
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-Renderer
          path: windows-electron-smoke.log
          if-no-files-found: error

      - name: Verify the official Harness dependencies
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: bun scripts/account-platform-windows-smoke.mjs --prepare-host "$env:RUNNER_TEMP/kwork-host-fixture"

      - name: Install the pinned wasm-bindgen compiler
        run: |
          $lock = Get-Content Cargo.lock -Raw
          $version = [regex]::Match($lock, 'name = "wasm-bindgen"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (!$version) { throw 'Missing wasm-bindgen version in Cargo.lock' }
          $package = "wasm-bindgen-$version-x86_64-pc-windows-msvc"
          $url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$package.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "$package.tar.gz"
          Invoke-WebRequest $url -OutFile $archive
          Invoke-WebRequest "$url.sha256sum" -OutFile "$archive.sha256sum"
          $checksum = ((Get-Content "$archive.sha256sum" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $checksum) {
            throw 'wasm-bindgen release checksum mismatch'
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .tools/bin | Out-Null
          Copy-Item "$env:RUNNER_TEMP/$package/wasm-bindgen.exe" .tools/bin

      - name: Build GPUI/WASM frontend
        run: bun run ui:build

      - name: Build Windows installer (NSIS)
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'thin' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'workflow_dispatch' && '16' || '1' }}
        run: bun x tauri build --bundles nsis

      - name: Verify the portable app layout
        id: portable-layout
        run: |
          foreach ($file in @('electron.exe', 'resources/app/main.cjs', 'resources/app/preload.cjs')) {
            if (!(Test-Path "target/release/account-platform/$file" -PathType Leaf)) {
              throw "Missing portable resource: $file"
            }
          }

      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-x64
          if-no-files-found: error
          path: |
            target/release/KWork.exe
            target/release/account-platform/
            target/release/bundle/nsis/*.exe

      - name: Exercise previews on Windows Chromium
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        run: |
          $env:CHROME_PATH = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (!(Test-Path $env:CHROME_PATH)) {
            $env:CHROME_PATH = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          }
          foreach ($mode in @('plan-preview', 'document-question', 'agent-presets', 'ui-feedback')) {
            bun scripts/markdown-tools-browser.mjs --mode $mode "target/windows-visual/$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Exercise the installed Windows app
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.portable-layout.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $directory = Join-Path $env:RUNNER_TEMP 'kwork-installed'
          $process = Start-Process -Wait -PassThru $installer.FullName -ArgumentList '/S', "/D=$directory"
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          foreach ($file in @('electron.exe', 'resources/app/main.cjs', 'resources/app/preload.cjs')) {
            if (!(Test-Path "$directory/account-platform/$file" -PathType Leaf)) {
              throw "Missing installed resource: $file"
            }
          }
          bun scripts/account-platform-windows-smoke.mjs "$directory/KWork.exe" "$env:RUNNER_TEMP/kwork-host-fixture/host"

      - name: Require a passing renderer smoke test
        if: github.event_name == 'workflow_dispatch' && steps.electron-smoke.outcome != 'success'
        run: exit 1

      - name: Upload Windows visual regression evidence
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-Visual
          path: target/windows-visual/
          if-no-files-found: ignore
