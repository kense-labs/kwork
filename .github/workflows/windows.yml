name: Windows build

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Submit the Windows NSIS binaries to SignPath for approved release signing
        required: false
        type: boolean
        default: false
      fast_build:
        description: Skip Rust LTO and wasm-opt for a faster non-release smoke run
        required: false
        type: boolean
        default: false
      ms_store_identity_name:
        description: Microsoft Partner Center Package/Identity/Name override (optional)
        required: false
        type: string
        default: ''
      ms_store_publisher:
        description: Microsoft Partner Center Publisher DN override, e.g. CN=... (optional)
        required: false
        type: string
        default: ''
      ms_store_publisher_display_name:
        description: Microsoft Partner Center PublisherDisplayName override (optional)
        required: false
        type: string
        default: ''
      ms_store_version:
        description: 4-part MSIX version Major.Minor.Build.0 override (optional)
        required: false
        type: string
        default: ''
  push:
    # workflow_dispatch requires the workflow on the default branch; push
    # events read the workflow from the pushed ref, so build branches work too.
    branches: [main, 'workbuddy/**']
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'services/**'
      - 'scripts/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '.github/workflows/windows.yml'

permissions:
  actions: read
  contents: read

jobs:
  build:
    # The manual desktop test needs a runner with a working WebView2 DevTools endpoint.
    # https://github.com/actions/runner-images/issues/14738
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'windows-2022' || 'windows-latest' }}
    env:
      KWORK_UI_BUILD: always
      # Release and signed builds always run wasm-opt -Oz (~28% smaller WASM);
      # only opt-in non-signed fast smoke dispatches skip it.
      KWORK_WASM_OPT: ${{ (github.event_name == 'workflow_dispatch' && inputs.fast_build && !inputs.sign_release) && 'off' || 'on' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Node.js (build tools)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: bun install --no-save

      - name: Package the pinned Electron account renderer
        run: |
          bun install --cwd services/account-platform-electron --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node services/account-platform-electron/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/build-account-platform-electron.mjs --windows-bundle

      - name: Verify the Electron renderer in isolation
        id: electron-smoke
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/account-platform-electron-smoke.mjs 2>&1 | Tee-Object -FilePath windows-electron-smoke.log
          exit $LASTEXITCODE

      - name: Upload the renderer smoke result
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-Renderer
          path: windows-electron-smoke.log
          if-no-files-found: error

      - name: Verify the official Harness dependencies
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: bun scripts/account-platform-windows-smoke.mjs --prepare-host "$env:RUNNER_TEMP/kwork-host-fixture"

      - name: Install the pinned wasm-bindgen compiler
        run: |
          $lock = Get-Content Cargo.lock -Raw
          $version = [regex]::Match($lock, 'name = "wasm-bindgen"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (!$version) { throw 'Missing wasm-bindgen version in Cargo.lock' }
          $package = "wasm-bindgen-$version-x86_64-pc-windows-msvc"
          $url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$package.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "$package.tar.gz"
          Invoke-WebRequest $url -OutFile $archive
          Invoke-WebRequest "$url.sha256sum" -OutFile "$archive.sha256sum"
          $checksum = ((Get-Content "$archive.sha256sum" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $checksum) {
            throw 'wasm-bindgen release checksum mismatch'
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .tools/bin | Out-Null
          Copy-Item "$env:RUNNER_TEMP/$package/wasm-bindgen.exe" .tools/bin

      - name: Build GPUI/WASM frontend
        run: bun run ui:build

      - name: Build Windows installer (NSIS)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sign_release) }}
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ (github.event_name == 'workflow_dispatch' && inputs.fast_build) && 'false' || 'thin' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (github.event_name == 'workflow_dispatch' && inputs.fast_build) && '16' || '1' }}
        run: bun x tauri build --bundles nsis

      - name: Build Windows release and collect inner binaries for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          SIGNPATH_STAGE: collect
        run: |
          node scripts/windows-packaging.mjs write-tauri-sign-config target/tauri-signpath.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun x tauri build --bundles nsis --config target/tauri-signpath.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('KWork.exe', 'uninstall.exe')) {
            if (!(Test-Path -LiteralPath "target/signpath-inner-unsigned/$file" -PathType Leaf)) {
              throw "Missing staged unsigned inner binary: target/signpath-inner-unsigned/$file"
            }
          }

      - name: Verify the portable app layout
        id: portable-layout
        run: |
          foreach ($file in @('electron.exe', 'resources/app/main.cjs', 'resources/app/preload.cjs')) {
            if (!(Test-Path "target/release/account-platform/$file" -PathType Leaf)) {
              throw "Missing portable resource: $file"
            }
          }
          foreach ($file in @('node.exe', 'node_modules/@deepseek-ai/dsh/lib/bin.js', 'node_modules/@deepseek-ai/dsh/lib/profile-boot.js', 'terminal-controller/v3/package/lib/index.js')) {
            if (!(Test-Path -LiteralPath "target/release/harness-runtime/$file" -PathType Leaf)) {
              throw "Missing portable Harness resource: $file"
            }
          }

      - name: Upload unsigned inner binaries for SignPath (Stage 1)
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        id: upload-unsigned-inner
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-Unsigned-Inner-${{ github.run_id }}
          if-no-files-found: error
          path: |
            target/signpath-inner-unsigned/KWork.exe
            target/signpath-inner-unsigned/uninstall.exe

      - name: Submit SignPath signing request for inner binaries (Stage 1)
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kwork
          signing-policy-slug: release-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'kwork-windows' }}
          github-artifact-id: ${{ steps.upload-unsigned-inner.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/signpath-inner-out

      - name: Verify SignPath-signed inner binaries and repack NSIS installer
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        shell: pwsh
        env:
          SIGNPATH_STAGE: inject
        run: |
          New-Item -ItemType Directory -Force target/signpath-inner-signed | Out-Null
          foreach ($name in @('KWork.exe', 'uninstall.exe')) {
            $signed = Get-ChildItem target/signpath-inner-out -Recurse -Filter $name | Select-Object -First 1
            if (!$signed) { throw "SignPath Stage 1 did not return $name." }
            $sig = Get-AuthenticodeSignature -FilePath $signed.FullName
            if ($sig.Status -ne 'Valid' -or !$sig.SignerCertificate) {
              throw "Invalid Authenticode signature on $($signed.FullName): $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "Verified inner $($signed.Name): $($sig.SignerCertificate.Subject)"
            Copy-Item -LiteralPath $signed.FullName -Destination "target/signpath-inner-signed/$name" -Force
          }
          bun x tauri bundle --bundles nsis --config target/tauri-signpath.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload outer NSIS installer for SignPath (Stage 2)
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-Unsigned-Installer-${{ github.run_id }}
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: Submit SignPath signing request for outer NSIS installer (Stage 2)
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kwork
          signing-policy-slug: release-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG || vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'kwork-windows' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/signpath-installer-out

      - name: Verify and stage final SignPath-signed binaries
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem target/signpath-installer-out -Recurse -Filter *.exe | Select-Object -First 1
          if (!$signedInstaller) { throw 'SignPath Stage 2 did not return the NSIS installer.' }
          $originalInstaller = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item -LiteralPath target/signpath-inner-signed/KWork.exe -Destination target/release/KWork.exe -Force
          Copy-Item -LiteralPath $signedInstaller.FullName -Destination $originalInstaller.FullName -Force
          foreach ($path in @('target/release/KWork.exe', $originalInstaller.FullName)) {
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne 'Valid' -or !$sig.SignerCertificate) {
              throw "Invalid Authenticode signature on ${path}: $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "Verified staged ${path}: $($sig.SignerCertificate.Subject)"
          }

      - name: Package Microsoft Store MSIX
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ inputs.ms_store_identity_name || vars.MS_STORE_IDENTITY_NAME || '' }}
          MS_STORE_PUBLISHER: ${{ inputs.ms_store_publisher || vars.MS_STORE_PUBLISHER || '' }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.ms_store_publisher_display_name || vars.MS_STORE_PUBLISHER_DISPLAY_NAME || '' }}
          MS_STORE_VERSION: ${{ inputs.ms_store_version || vars.MS_STORE_VERSION || '' }}
        run: |
          $argsList = @('scripts/windows-packaging.mjs', 'build-msix')
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $argsList += '--smoke-test'
          }
          node @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise previews on Windows Chromium
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        run: |
          $env:CHROME_PATH = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (!(Test-Path $env:CHROME_PATH)) {
            $env:CHROME_PATH = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          }
          foreach ($mode in @('plan-preview', 'document-question', 'agent-presets', 'ui-feedback')) {
            bun scripts/markdown-tools-browser.mjs --mode $mode "target/windows-visual/$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Exercise the installed Windows app
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.portable-layout.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $directory = Join-Path $env:RUNNER_TEMP 'kwork-installed'
          $process = Start-Process -Wait -PassThru $installer.FullName -ArgumentList '/S', "/D=$directory"
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          foreach ($file in @('electron.exe', 'resources/app/main.cjs', 'resources/app/preload.cjs')) {
            if (!(Test-Path "$directory/account-platform/$file" -PathType Leaf)) {
              throw "Missing installed resource: $file"
            }
          }
          if ('${{ inputs.sign_release }}' -eq 'true') {
            foreach ($installedExe in @("$directory/KWork.exe", "$directory/uninstall.exe")) {
              $sig = Get-AuthenticodeSignature -FilePath $installedExe
              if ($sig.Status -ne 'Valid' -or !$sig.SignerCertificate) {
                throw "Installed binary missing valid Authenticode signature ($installedExe): $($sig.Status) $($sig.StatusMessage)"
              }
              Write-Host "Verified installed signature on ${installedExe}: $($sig.SignerCertificate.Subject)"
            }
          }
          bun scripts/account-platform-windows-smoke.mjs "$directory/KWork.exe"

      - name: Require a passing renderer smoke test
        if: github.event_name == 'workflow_dispatch' && steps.electron-smoke.outcome != 'success'
        run: exit 1

      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-x64
          if-no-files-found: error
          path: |
            target/release/KWork.exe
            target/release/account-platform/
            target/release/harness-runtime/
            target/release/bundle/nsis/*.exe
            target/release/bundle/msix/*.msix

      - name: Upload Microsoft Store MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-MSIX
          if-no-files-found: error
          path: target/release/bundle/msix/*.msix

      - name: Upload Windows visual regression evidence
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-Visual
          path: target/windows-visual/
          if-no-files-found: ignore
